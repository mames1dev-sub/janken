<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janken GAME!</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>
  <h1>Janken GAME!</h1>
  <h2>エントリー</h2>
  <div th:if="${entry}">
    <ul>
      <li th:each="user : ${entry.users}">[[${user}]]</li>
    </ul>
  </div>
  <div th:if="${login_user}">
    Hi [[${login_user}]]
  </div>
  <div>
    <a href="/jankengame?hand=Gu">グー</a>
    <a href="/jankengame?hand=Choki">チョキ</a>
    <a href="/jankengame?hand=Pa">パー</a>
  </div>
  <div th:if="${janken != null}">
    <div>あなたの手：[[${janken.userHand}]]</div>
    <div>相手の手：[[${janken.cpuHand}]]</div>
    <div>結果：[[${janken.result}]]</div>
  </div>
  <p><a href="/">トップページへ戻る</a></p>
</body>

</html>
