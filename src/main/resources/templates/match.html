<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>
  <h1>Match</h1>
  <h2>[[${login_user}]] vs [[${opponent.name}]]</h2>
  <div th:if="${opponent.name == 'CPU'}">
    <a th:href="@{/fight(id=${opponent.id},hand='Gu')}">グー</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Choki')}">チョキ</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Pa')}">パー</a>
  </div>
  <div th:if="${janken != null}">
    <div>[[${login_user}]]の手：[[${janken.userHand}]]</div>
    <div>[[${opponent.name}]]の手：[[${janken.cpuHand}]]</div>
    <div>結果：[[${janken.result}]]</div>
  </div>
  <a href="/janken">もどる</a>
</body>

</html>
